[workspace]
resolver = "2"
members = ["crates/lagcore", "crates/lagrelayd", "crates/lagrelay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "sync", "macros", "signal", "io-util", "process"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
